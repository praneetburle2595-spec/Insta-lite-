name: Build Android APK
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.9'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Check screen policy
        run: |
          mkdir -p /tmp/focus-test
          javac -d /tmp/focus-test app/src/main/java/com/praneet/focuslayer/ScreenPolicy.java tests/ScreenPolicyTest.java
          java -cp /tmp/focus-test ScreenPolicyTest
      - run: gradle --no-daemon :app:assembleRelease
      - name: Verify APK signature and permissions
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$apk" > permissions.txt
          if grep -q 'uses-permission:' permissions.txt; then cat permissions.txt; exit 1; fi
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" > badging.txt
          if grep -q 'application-debuggable' badging.txt; then exit 1; fi
          sha256sum "$apk" > APK-SHA256.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Focus-Layer-reviewed-APK
          path: |
            app/build/outputs/apk/release/app-release.apk
            APK-SHA256.txt
            permissions.txt
