name: Build Android APK
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Check screen policy
        run: |
          mkdir -p /tmp/focus-test
          javac -d /tmp/focus-test app/src/main/java/com/praneet/focuslayer/ScreenPolicy.java tests/ScreenPolicyTest.java
          java -cp /tmp/focus-test ScreenPolicyTest
      - run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Focus-Layer-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
